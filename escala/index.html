<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala da Barraca do Macarrão</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8D%9D</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbf3e2;
    --paper-line: #e8d9b8;
    --ink: #2b1b14;
    --ink-soft: #6b5a48;
    --sauce: #c33c26;
    --sauce-dark: #a12e1b;
    --mustard: #d99a1f;
    --basil: #4f7942;
    --basil-soft: #e4efdd;
    --card: #ffffff;
    --shadow: rgba(43, 27, 20, 0.14);
    --focus: #1c6ee0;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #211510;
      --paper-line: #3a281f;
      --ink: #f3e7d8;
      --ink-soft: #b9a48f;
      --sauce: #e2593f;
      --sauce-dark: #ff7a5c;
      --mustard: #e8b545;
      --basil: #8ec97c;
      --basil-soft: #26331f;
      --card: #2c1d16;
      --shadow: rgba(0, 0, 0, 0.45);
      --focus: #6cb2ff;
    }
  }

  :root[data-theme="dark"] {
    --paper: #211510;
    --paper-line: #3a281f;
    --ink: #f3e7d8;
    --ink-soft: #b9a48f;
    --sauce: #e2593f;
    --sauce-dark: #ff7a5c;
    --mustard: #e8b545;
    --basil: #8ec97c;
    --basil-soft: #26331f;
    --card: #2c1d16;
    --shadow: rgba(0, 0, 0, 0.45);
    --focus: #6cb2ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image: repeating-linear-gradient(
      var(--paper-line) 0 1px,
      transparent 1px 34px
    );
    color: var(--ink);
    font-family: "Karla", "Segoe UI", system-ui, sans-serif;
    padding: 28px 16px 64px;
    display: flex;
    justify-content: center;
  }

  .sheet {
    width: 100%;
    max-width: 1180px;
  }

  header.ticket {
    background: var(--sauce);
    color: #fff8ee;
    border-radius: 14px;
    padding: 22px 24px 20px;
    box-shadow: 0 10px 24px var(--shadow);
    position: relative;
    overflow: hidden;
  }

  header.ticket::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 10px;
    background: repeating-linear-gradient(
      -45deg,
      transparent 0 8px,
      rgba(255, 255, 255, 0.18) 8px 16px
    );
  }

  .ticket .eyebrow {
    font-family: "JetBrains Mono", "Consolas", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.85;
    margin: 0 0 6px;
  }

  .ticket h1 {
    font-family: "Baloo 2", "Segoe UI", sans-serif;
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    line-height: 1.05;
    margin: 0 0 8px;
    text-wrap: balance;
  }

  .ticket p.sub {
    margin: 0;
    font-size: 1rem;
    opacity: 0.92;
    max-width: 60ch;
  }

  .ticket .dates {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .date-chip {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.82rem;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.32);
    border-radius: 999px;
    padding: 5px 12px;
  }

  .note {
    margin-top: 18px;
    font-size: 0.88rem;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px dashed var(--paper-line);
    border-radius: 10px;
    padding: 12px 14px;
    line-height: 1.5;
  }

  .roles-card {
    margin-top: 12px;
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .roles-card h3 {
    margin: 0 0 10px;
    font-family: "Baloo 2", sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
  }

  .roles-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 8px 18px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .roles-list li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 0.88rem;
    color: var(--ink-soft);
  }

  .roles-list .role-emoji {
    font-size: 1rem;
  }

  .roles-list .role-count {
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    color: var(--sauce);
  }

  .roles-total {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--paper-line);
    font-size: 0.82rem;
    color: var(--ink-soft);
  }

  .funcoes-card {
    margin-top: 12px;
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .funcoes-card .funcoes-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    flex-wrap: wrap; margin-bottom: 6px;
  }
  .funcoes-card h3 {
    margin: 0;
    font-family: "Baloo 2", sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
  }
  .funcoes-card .funcoes-note {
    font-size: 0.78rem; color: var(--ink-soft); margin: 0 0 12px;
  }
  .btn-lock {
    font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 0.78rem;
    background: var(--paper); border: 1px solid var(--paper-line); color: var(--ink-soft);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .btn-lock[data-unlocked="true"] {
    background: var(--basil-soft); border-color: var(--basil); color: var(--basil);
  }
  .func-table-wrap { overflow-x: auto; }
  .func-table { border-collapse: collapse; width: 100%; min-width: 640px; }
  .func-table th, .func-table td {
    border: 1px solid var(--paper-line);
    padding: 8px 10px;
    vertical-align: top;
    font-size: 0.82rem;
  }
  .func-table thead th {
    font-family: "Baloo 2", sans-serif; font-size: 0.78rem; text-align: center;
    background: var(--paper); border-bottom: 2px solid var(--paper-line);
  }
  .func-table tbody th {
    font-family: "Baloo 2", sans-serif; font-weight: 600; font-size: 0.82rem;
    text-align: left; white-space: nowrap; background: var(--paper);
  }
  .func-chips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 22px; }
  .func-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--basil-soft); color: var(--basil);
    border-radius: 999px; padding: 3px 4px 3px 10px;
    font-size: 0.76rem; font-weight: 600; white-space: nowrap;
  }
  .func-chip button {
    border: none; background: none; color: var(--sauce); cursor: pointer;
    font-weight: 700; font-size: 0.8rem; line-height: 1; padding: 2px;
  }
  .func-add-row { margin-top: 6px; display: flex; gap: 4px; }
  .func-add-row select {
    flex: 1; font-size: 0.76rem; padding: 4px; border-radius: 6px;
    border: 1px solid var(--paper-line); background: var(--card); color: var(--ink);
  }

  .pin-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .pin-box {
    background: var(--card); border-radius: 14px; padding: 26px 22px; max-width: 320px; width: 100%;
    text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.3);
  }
  .pin-box h2 { font-family: "Baloo 2", sans-serif; font-size: 1.1rem; margin: 0 0 14px; }
  .pin-box input {
    width: 100%; text-align: center; font-size: 1.3rem; letter-spacing: 0.3em;
    padding: 12px; border-radius: 10px; border: 1px solid var(--paper-line); margin-bottom: 10px;
  }
  .pin-error { color: var(--sauce); font-size: 0.82rem; min-height: 1.2em; margin-bottom: 6px; }
  .pin-box .row { display: flex; gap: 8px; }
  .pin-box button { flex: 1; font-family: "Baloo 2", sans-serif; font-weight: 700; padding: 10px; border-radius: 999px; border: none; cursor: pointer; }
  .pin-box .cancel { background: var(--paper); border: 1px solid var(--paper-line); }
  .pin-box .submit { background: var(--basil); color: #fff; }

  .board {
    margin-top: 22px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 6px 18px var(--shadow);
    padding: 6px;
    overflow-x: auto;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 640px;
  }

  thead th {
    font-family: "Baloo 2", sans-serif;
    font-weight: 600;
    text-align: center;
    padding: 14px 8px 10px;
    font-size: 0.92rem;
    color: var(--ink);
    border-bottom: 2px solid var(--paper-line);
  }

  thead th .day {
    display: block;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 3px;
  }

  thead th .vol-count {
    display: inline-block;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--paper-line);
    border-radius: 999px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 2px;
  }

  thead th .min-tag {
    display: block;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.6rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--mustard);
    margin-top: 2px;
  }

  .min-hint {
    display: inline-block;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
    background: var(--sauce);
    border-radius: 999px;
    padding: 2px 9px;
    margin-top: 4px;
  }

  thead th:first-child {
    text-align: left;
    min-width: 170px;
  }

  tbody td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--paper-line);
    text-align: center;
  }

  tbody td:first-child {
    text-align: left;
  }

  .person {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--mustard);
    color: #2b1b14;
    font-weight: 700;
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  input.person-name {
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 5px 7px;
    min-width: 120px;
    flex: 1 1 auto;
  }

  input.person-name:hover { border-color: var(--paper-line); }

  input.person-name:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
    border-color: transparent;
    background: var(--paper);
  }

  input.phone {
    width: 100%;
    min-width: 150px;
    padding: 7px 9px;
    border-radius: 7px;
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink);
    font-family: "JetBrains Mono", monospace;
    font-size: 0.82rem;
  }

  input.phone::placeholder { color: var(--ink-soft); opacity: 0.6; }

  input.phone:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  .check {
    appearance: none;
    -webkit-appearance: none;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 2px solid var(--paper-line);
    background: transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .check:hover { border-color: var(--sauce); }

  .check:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .check[data-on="true"] {
    background: var(--basil);
    border-color: var(--basil);
  }

  .check[data-on="true"]::after {
    content: "✓";
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
  }

  tfoot td {
    padding: 10px 8px 14px;
    text-align: center;
    font-family: "JetBrains Mono", monospace;
  }

  tfoot td:first-child { text-align: left; }

  .tally {
    display: inline-block;
    min-width: 26px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--basil-soft);
    color: var(--basil);
    font-weight: 700;
    font-size: 0.82rem;
  }

  .tally[data-empty="true"] {
    background: transparent;
    color: var(--ink-soft);
    border: 1px dashed var(--paper-line);
  }

  .tally[data-low="true"] {
    background: var(--mustard);
    color: #2b1b14;
  }

  .addrow {
    display: flex;
    gap: 8px;
    padding: 14px 12px 8px;
    flex-wrap: wrap;
  }

  .addrow input {
    flex: 1 1 220px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.92rem;
  }

  .addrow input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  .addrow button {
    background: var(--sauce);
    color: #fff8ee;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-family: "Baloo 2", sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
  }

  .addrow button:hover { background: var(--sauce-dark); }
  .addrow button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .remove {
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 1rem;
    padding: 2px 6px;
    border-radius: 6px;
    line-height: 1;
  }
  .remove:hover { color: var(--sauce); background: var(--basil-soft); }

  footer.legend {
    margin-top: 16px;
    font-size: 0.82rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .status-pill {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.72rem;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--paper-line);
  }

  .status-pill[data-tone="err"] { color: var(--sauce); border-color: var(--sauce); }
  .status-pill[data-tone="ok"] { color: var(--basil); border-color: var(--basil); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <p style="text-align:center;padding:40px 0;color:var(--ink-soft)">Carregando…</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDXQPP_tlk7k628PqJLQbearQlaN4pN_0w",
    authDomain: "fraternidadedoamor-ef315.firebaseapp.com",
    databaseURL: "https://fraternidadedoamor-ef315-default-rtdb.firebaseio.com",
    projectId: "fraternidadedoamor-ef315",
    storageBucket: "fraternidadedoamor-ef315.firebasestorage.app",
    messagingSenderId: "703575848763",
    appId: "1:703575848763:web:52548e6124b8a0841c691e",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const rootRef = db.ref("escalaMacarrao");

  const SHIFTS = [
    { id: "sab-manha", day: "Sáb · 19/09", time: "10h–16h" },
    { id: "sab-tarde", day: "Sáb · 19/09", time: "16h–22h" },
    { id: "dom-manha", day: "Dom · 20/09", time: "10h–16h" },
    { id: "dom-tarde", day: "Dom · 20/09", time: "16h–22h" },
  ];

  const MIN_PER_SHIFT = 17;

  const SEED_VOLUNTEERS = {
    v1: { name: "Ricardo Bianchini", phone: "(11) 99320-2884", order: 1 },
    v2: { name: "Alessandra Aparecida", phone: "(11) 99110-3829", order: 2 },
    v3: { name: "Daniela Bianchini", phone: "", order: 3 },
    v4: { name: "Rubens Pacca Guimarães", phone: "", order: 4 },
    v5: { name: "Barbara", phone: "(11) 99683-8437", order: 5 },
    v6: { name: "Frann Marques", phone: "(11) 99634-4885", order: 6 },
    v7: { name: "Ieda Cristina", phone: "(11) 98923-8218", order: 7 },
    v8: { name: "Tatiane Piqué", phone: "", order: 8 },
    v9: { name: "Urania", phone: "(11) 99312-9499", order: 9 },
    v10: { name: "Valeria Thomazini Gouveia", phone: "(11) 96413-6321", order: 10 },
    v11: { name: "Yramaia", phone: "(11) 99142-5782", order: 11 },
    v12: { name: "Maria", phone: "", order: 12 },
  };

  const ADMIN_PIN = "1313";
  const FUNCOES_SEED = {
    atendimento: { label: "Atendimento no balcão", icon: "🧾", ordem: 1 },
    pesando: { label: "Pesando frango e polenta", icon: "🍗", ordem: 2 },
    fritando: { label: "Fritando frango e polenta", icon: "🔥", ordem: 3 },
    molho: { label: "Preparando o molho", icon: "🥣", ordem: 4 },
    limpeza: { label: "Limpeza e organização", icon: "🧹", ordem: 5 },
    servindo: { label: "Servindo macarrão", icon: "🍝", ordem: 6 },
  };

  let state = { volunteers: {}, availability: {}, funcoes: {}, atribuicoes: {} };
  let seeded = false;
  let funcoesSeeded = false;
  let funcEditUnlocked = false;

  function funcaoList() {
    return Object.entries(state.funcoes || {})
      .map(([id, f]) => ({ id, ...f }))
      .sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
  }

  function volunteerName(id) {
    const v = state.volunteers && state.volunteers[id];
    return v ? v.name : null;
  }

  function renderFuncoesTable() {
    const funcoes = funcaoList();
    const vols = volunteerList();
    const headCells = SHIFTS.map((s) => `<th><span class="day">${s.day}</span>${s.time}</th>`).join("");

    const rows = funcoes.map((f) => {
      const cells = SHIFTS.map((s) => {
        const assigned = (state.atribuicoes[f.id] && state.atribuicoes[f.id][s.id]) || {};
        const assignedIds = Object.keys(assigned).filter((id) => assigned[id]);
        const chips = assignedIds.map((id) => {
          const name = volunteerName(id);
          if (!name) return "";
          return `<span class="func-chip">${esc(name)}${funcEditUnlocked ? `<button type="button" data-func-remove data-func="${f.id}" data-shift="${s.id}" data-vol="${id}" aria-label="Remover ${esc(name)}">✕</button>` : ""}</span>`;
        }).join("");
        const addRow = funcEditUnlocked ? `
          <div class="func-add-row">
            <select data-func-add data-func="${f.id}" data-shift="${s.id}">
              <option value="">+ adicionar…</option>
              ${vols.filter((v) => !assignedIds.includes(v.id)).map((v) => `<option value="${v.id}">${esc(v.name)}</option>`).join("")}
            </select>
          </div>` : "";
        return `<td><div class="func-chips">${chips}</div>${addRow}</td>`;
      }).join("");
      return `<tr><th>${f.icon || ""} ${esc(f.label)}</th>${cells}</tr>`;
    }).join("");

    return `<table class="func-table">
      <thead><tr><th>Função</th>${headCells}</tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  function formatPhone(raw) {
    const digits = String(raw).replace(/\D/g, "").slice(0, 11);
    if (!digits) return "";
    const ddd = digits.slice(0, 2);
    const rest = digits.slice(2);
    let out = "(" + ddd + (digits.length > 2 ? ") " : "");
    if (rest.length > 5) out += rest.slice(0, rest.length - 4) + "-" + rest.slice(-4);
    else out += rest;
    return out;
  }

  function initials(name) {
    return name.trim().split(/\s+/).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function volunteerList() {
    return Object.entries(state.volunteers || {})
      .map(([id, v]) => ({ id, ...v }))
      .sort((a, b) => (a.name || "").localeCompare(b.name || "", "pt-BR", { sensitivity: "base" }));
  }

  function render() {
    const vols = volunteerList();
    const rows = vols.map((v) => {
      const cells = SHIFTS.map((s) => {
        const on = !!(state.availability[v.id] && state.availability[v.id][s.id]);
        return `<td><button class="check" type="button" data-on="${on}" data-vol="${v.id}" data-shift="${s.id}" aria-label="${esc(v.name)} — ${s.day} ${s.time}" aria-pressed="${on}"></button></td>`;
      }).join("");
      return `<tr>
        <td><div class="person"><span class="avatar">${esc(initials(v.name || "?"))}</span><input type="text" class="person-name" data-vol="${v.id}" value="${esc(v.name || "")}" aria-label="Nome do voluntário" /><button class="remove" type="button" data-remove="${v.id}" aria-label="Remover ${esc(v.name)}" title="Remover">✕</button></div></td>
        <td><input type="tel" class="phone" data-vol="${v.id}" value="${esc(v.phone || "")}" placeholder="(11) 9XXXX-XXXX" aria-label="WhatsApp de ${esc(v.name)}" /></td>
        ${cells}
      </tr>`;
    }).join("");

    const totals = SHIFTS.map((s) => {
      const count = vols.filter((v) => state.availability[v.id] && state.availability[v.id][s.id]).length;
      if (count === 0) return `<td><span class="tally" data-empty="true">0</span></td>`;
      const low = count < MIN_PER_SHIFT;
      return `<td><span class="tally"${low ? ' data-low="true"' : ""}>${count}</span>${low ? `<div class="min-hint">faltam ${MIN_PER_SHIFT - count}</div>` : ""}</td>`;
    }).join("");

    const headCells = SHIFTS.map((s) => `<th><span class="day">${s.day}</span>${s.time}<span class="min-tag">mín. ${MIN_PER_SHIFT}</span></th>`).join("");

    document.getElementById("sheet").innerHTML = `
      <header class="ticket">
        <p class="eyebrow">Fraternidade do Amor · Festa beneficente</p>
        <h1>Barraca do Macarrão — MoocAmor</h1>
        <p class="sub">Escala de voluntários. Marque os horários em que você topa ajudar — a lista atualiza para todo mundo do grupo em tempo real.</p>
        <div class="dates">
          <span class="date-chip">Sáb 19/09</span>
          <span class="date-chip">Dom 20/09</span>
          <span class="date-chip">10h–16h &amp; 16h–22h</span>
        </div>
      </header>

      <p class="note">Horários sujeitos a ajuste conforme o movimento da barraca. Marque um ✓ em cada turno que você confirma — pode marcar mais de um. Precisamos de pelo menos <b>17 voluntários por turno</b>. Use "+ Adicionar nome" se seu nome não estiver na lista.</p>

      <div class="roles-card">
        <h3>Pra barraca rodar redondinha em cada turno, precisamos de:</h3>
        <ul class="roles-list">
          <li><span class="role-emoji">🔥</span><span class="role-count">5</span> na fritura</li>
          <li><span class="role-emoji">🧹</span><span class="role-count">2</span> organizando e limpando</li>
          <li><span class="role-emoji">🍗</span><span class="role-count">2</span> fracionando o frango e a polenta</li>
          <li><span class="role-emoji">🥣</span><span class="role-count">1 ou 2</span> cuidando do molho</li>
          <li><span class="role-emoji">🍝</span><span class="role-count">3</span> no macarrão</li>
          <li><span class="role-emoji">🧾</span><span class="role-count">3</span> atendendo no balcão</li>
        </ul>
        <p class="roles-total">Somando tudo, dá os 17 voluntários por turno da meta acima.</p>
      </div>

      <div class="funcoes-card">
        <div class="funcoes-head">
          <h3>Quem faz o quê em cada turno</h3>
          <button class="btn-lock" id="btn-func-lock" data-unlocked="${funcEditUnlocked}">${funcEditUnlocked ? "🔓 Edição liberada" : "🔒 Só admin edita"}</button>
        </div>
        <p class="funcoes-note">${funcEditUnlocked ? "Edição liberada neste aparelho — toque em + Adicionar ou no ✕ dos nomes." : "Consulta liberada pra todo mundo. Só quem tem o PIN pode mudar quem faz o quê."}</p>
        <div class="func-table-wrap">
          ${renderFuncoesTable()}
        </div>
      </div>

      <div class="board">
        <table>
          <thead>
            <tr>
              <th>Voluntário(a) <span class="vol-count">${vols.length}</span></th>
              <th>WhatsApp</th>
              ${headCells}
            </tr>
          </thead>
          <tbody id="rows">
            ${rows}
          </tbody>
          <tfoot>
            <tr>
              <td>Confirmados</td>
              <td></td>
              ${totals}
            </tr>
          </tfoot>
        </table>
        <form class="addrow" id="addrow">
          <input type="text" id="newname" placeholder="Adicionar seu nome…" autocomplete="off" required />
          <input type="tel" id="newphone" placeholder="(11) 9XXXX-XXXX" autocomplete="off" />
          <button type="submit">+ Adicionar nome</button>
        </form>
      </div>

      <footer class="legend">
        <span class="status-pill" id="save-status">conectado</span>
        <span>19–20 de setembro · Barraca do Macarrão</span>
      </footer>

      <div class="pin-overlay" id="pin-overlay" style="display:none;">
        <div class="pin-box">
          <h2>Digite o PIN da organização</h2>
          <input type="password" inputmode="numeric" id="pin-input" placeholder="PIN" maxlength="8" />
          <div class="pin-error" id="pin-error"></div>
          <div class="row">
            <button class="cancel" id="pin-cancel">Cancelar</button>
            <button class="submit" id="pin-submit">Entrar</button>
          </div>
        </div>
      </div>
    `;
    attach();
  }

  function setStatus(text, tone) {
    const pill = document.getElementById("save-status");
    if (!pill) return;
    pill.textContent = text;
    if (tone) pill.dataset.tone = tone;
    else delete pill.dataset.tone;
  }

  function attach() {
    document.querySelectorAll(".check").forEach((btn) => {
      btn.addEventListener("click", () => {
        const vol = btn.dataset.vol, shift = btn.dataset.shift;
        const current = !!(state.availability[vol] && state.availability[vol][shift]);
        rootRef.child("availability").child(vol).child(shift).set(!current);
      });
    });
    document.querySelectorAll("[data-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.remove;
        rootRef.child("volunteers").child(id).remove();
        rootRef.child("availability").child(id).remove();
      });
    });
    document.querySelectorAll("input.phone").forEach((inp) => {
      inp.addEventListener("focus", () => {
        if (!inp.value) inp.value = "(11) ";
      });
      inp.addEventListener("input", () => {
        inp.value = formatPhone(inp.value);
      });
      inp.addEventListener("blur", () => {
        const val = /^\(\d{0,2}\)?\s?$/.test(inp.value) ? "" : inp.value;
        rootRef.child("volunteers").child(inp.dataset.vol).child("phone").set(val);
      });
    });
    document.querySelectorAll("input.person-name").forEach((inp) => {
      inp.addEventListener("blur", () => {
        const val = inp.value.trim() || "Sem nome";
        rootRef.child("volunteers").child(inp.dataset.vol).child("name").set(val);
      });
    });
    const newphone = document.getElementById("newphone");
    newphone.addEventListener("focus", () => {
      if (!newphone.value) newphone.value = "(11) ";
    });
    newphone.addEventListener("input", () => {
      newphone.value = formatPhone(newphone.value);
    });
    document.getElementById("addrow").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const nameInput = document.getElementById("newname");
      const name = nameInput.value.trim();
      if (!name) return;
      const phoneVal = /^\(\d{0,2}\)?\s?$/.test(newphone.value) ? "" : newphone.value;
      const maxOrder = volunteerList().reduce((m, v) => Math.max(m, v.order ?? 0), 0);
      const newId = rootRef.child("volunteers").push().key;
      rootRef.child("volunteers").child(newId).set({ name, phone: phoneVal, order: maxOrder + 1 });
      nameInput.value = "";
      newphone.value = "";
    });

    document.getElementById("btn-func-lock").addEventListener("click", () => {
      if (funcEditUnlocked) {
        funcEditUnlocked = false;
        render();
        return;
      }
      const overlay = document.getElementById("pin-overlay");
      document.getElementById("pin-input").value = "";
      document.getElementById("pin-error").textContent = "";
      overlay.style.display = "flex";
      document.getElementById("pin-input").focus();
    });
    document.getElementById("pin-cancel").addEventListener("click", () => {
      document.getElementById("pin-overlay").style.display = "none";
    });
    document.getElementById("pin-input").addEventListener("keydown", (e) => { if (e.key === "Enter") checkPin(); });
    document.getElementById("pin-submit").addEventListener("click", checkPin);

    document.querySelectorAll("[data-func-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const { func, shift, vol } = btn.dataset;
        rootRef.child("atribuicoes").child(func).child(shift).child(vol).remove();
      });
    });
    document.querySelectorAll("[data-func-add]").forEach((sel) => {
      sel.addEventListener("change", () => {
        const { func, shift } = sel.dataset;
        const vol = sel.value;
        if (!vol) return;
        rootRef.child("atribuicoes").child(func).child(shift).child(vol).set(true);
      });
    });
  }

  function checkPin() {
    const val = document.getElementById("pin-input").value;
    if (val !== ADMIN_PIN) {
      document.getElementById("pin-error").textContent = "PIN incorreto.";
      return;
    }
    document.getElementById("pin-overlay").style.display = "none";
    funcEditUnlocked = true;
    render();
  }

  rootRef.on("value", (snap) => {
    const data = snap.val();
    if (!data && !seeded) {
      seeded = true;
      rootRef.set({ volunteers: SEED_VOLUNTEERS, availability: {} });
      return;
    }
    state = {
      volunteers: (data && data.volunteers) || {},
      availability: (data && data.availability) || {},
      funcoes: (data && data.funcoes) || {},
      atribuicoes: (data && data.atribuicoes) || {},
    };
    if (data && !data.funcoes && !funcoesSeeded) {
      funcoesSeeded = true;
      rootRef.child("funcoes").set(FUNCOES_SEED);
    }
    render();
    setStatus("conectado", "ok");
  }, (err) => {
    setStatus("erro de conexão", "err");
    console.error(err);
  });
</script>
</body>
</html>
