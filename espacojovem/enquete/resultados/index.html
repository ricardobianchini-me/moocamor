<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados da enquete — Espaço Jovem</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#123c3f">
<link rel="icon" type="image/png" href="../../icone-espaco-jovem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../estilo.css">
<style>
  /* Cor das barras validada (dataviz/validate_palette.js): claro #009690, escuro #1fa9a2. */
  :root { --barra: #009690; --trilho: #e9efee; --celula-texto-claro: #ffffff; --celula-texto-escuro: #10201f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --barra: #1fa9a2; --trilho: #22302f; --celula-texto-claro: #0b1716; --celula-texto-escuro: #e8f3f2; } }
  :root[data-theme="dark"] { --barra: #1fa9a2; --trilho: #22302f; --celula-texto-claro: #0b1716; --celula-texto-escuro: #e8f3f2; }

  .faixa { background: linear-gradient(135deg, rgba(18, 60, 63, 0.94), rgba(29, 107, 110, 0.88) 50%, rgba(118, 82, 168, 0.90)), url("../../padrao-espaco-jovem.jpg") center / 480px auto repeat; color: #fff; text-align: center; padding: 52px 20px 58px; }
  .faixa .olho { color: #bfe0dd; }
  .faixa h1 { font-weight: 700; font-size: clamp(2rem, 6vw, 3rem); }
  .faixa p { margin: 10px auto 0; max-width: 60ch; opacity: 0.94; }
  .faixa .atualizado { display: inline-block; margin-top: 14px; font-family: "Roboto Mono", monospace; font-size: 0.78rem; background: rgba(255, 255, 255, 0.14); border-radius: 999px; padding: 6px 14px; }

  main { max-width: 1060px; margin: 0 auto; padding: 36px 16px 80px; }
  .tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); margin-bottom: 30px; }
  .tile { background: var(--branco); border: 1.5px solid var(--linha); border-radius: 20px; padding: 18px 20px; }
  .tile .rot { font-size: 0.9rem; color: var(--ink-soft); }
  .tile .val { font-family: "Poppins", sans-serif; font-weight: 600; font-size: 2.2rem; line-height: 1.15; color: var(--ink); }
  .tile.hero .val { font-size: 3.2rem; }

  .bloco { background: var(--branco); border: 1.5px solid var(--linha); border-radius: 22px; padding: 22px 24px; margin-bottom: 18px; }
  .bloco h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; }
  .bloco h2::after { display: none; }
  .bloco .sub { color: var(--ink-soft); font-size: 0.92rem; margin: 0 0 16px; }
  .grade-graficos { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
  .grafico h3 { font-size: 1.02rem; font-weight: 600; margin: 0 0 2px; }
  .grafico .base { font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 12px; }

  /* Barras horizontais: uma série, uma cor; valor na ponta; 4px arredondado na ponta, reto na base */
  .barras { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .barras li { display: grid; grid-template-columns: minmax(0, 42%) 1fr; gap: 12px; align-items: center; outline: none; border-radius: 8px; }
  .barras li:focus-visible { box-shadow: 0 0 0 3px var(--focus); }
  .barras .rot { font-size: 0.9rem; color: var(--ink); line-height: 1.3; }
  .barras .pista { display: flex; align-items: center; gap: 8px; min-height: 22px; }
  .barras .barra { height: 14px; background: var(--barra); border-radius: 0 4px 4px 0; min-width: 2px; }
  .barras .barra.zero { background: var(--trilho); width: 2px !important; }
  .barras .num { font-family: "Plus Jakarta Sans", sans-serif; font-variant-numeric: tabular-nums; font-size: 0.86rem; color: var(--ink-soft); white-space: nowrap; }
  .barras .num b { color: var(--ink); }
  @media (max-width: 520px) { .barras li { grid-template-columns: 1fr; gap: 4px; } }

  /* Tabela de calor: um tom, do claro ao escuro, número sempre escrito */
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .filtros button { font-family: "Poppins", sans-serif; font-weight: 600; font-size: 0.88rem; border: 1.5px solid var(--linha); background: var(--branco); color: var(--ink-soft); border-radius: 999px; padding: 7px 15px; cursor: pointer; }
  .filtros button[aria-pressed="true"] { background: var(--petroleo-esc); border-color: var(--petroleo-esc); color: #fff; }
  .rolagem { overflow-x: auto; }
  table.calor { border-collapse: separate; border-spacing: 2px; min-width: 100%; font-size: 0.86rem; }
  table.calor th { font-family: "Poppins", sans-serif; font-weight: 600; text-align: left; padding: 6px 8px; color: var(--ink); vertical-align: bottom; }
  table.calor thead th { font-size: 0.8rem; color: var(--ink-soft); font-weight: 500; min-width: 84px; }
  table.calor th.faixa-col { white-space: nowrap; }
  table.calor th.faixa-col small { display: block; font-family: "Plus Jakarta Sans", sans-serif; font-weight: 400; color: var(--ink-soft); }
  table.calor td { text-align: center; padding: 10px 6px; border-radius: 6px; font-variant-numeric: tabular-nums; font-weight: 700; outline: none; }
  table.calor td:focus-visible { box-shadow: 0 0 0 3px var(--focus); }
  .escala { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--ink-soft); margin-top: 10px; }
  .escala i { display: inline-block; width: 120px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--barra) 8%, var(--branco)), var(--barra)); }

  .textos { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .textos ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; max-height: 420px; overflow-y: auto; }
  .textos li { background: var(--creme); border-radius: 12px; padding: 10px 12px; font-size: 0.93rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .vazio { color: var(--ink-soft); font-style: italic; }

  .aviso-vazio { text-align: center; padding: 40px 20px; }
  .aviso-vazio h2 { font-size: 1.6rem; }
  .aviso-vazio h2::after { display: none; }
  .notas { font-size: 0.86rem; color: var(--ink-soft); }
  .notas li + li { margin-top: 4px; }

  .portao { display: grid; place-items: center; padding: 20px 0 40px; }
  .portao form { width: 100%; max-width: 380px; text-align: center; background: var(--branco); border: 1.5px solid var(--linha); border-radius: 24px; padding: 30px 26px; box-shadow: var(--sombra); }
  .portao h2 { font-size: 1.5rem; }
  .portao h2::after { display: none; }
  .portao p { color: var(--ink-soft); margin: 8px 0 0; }
  .portao input { width: 100%; text-align: center; font-family: "Roboto Mono", monospace; font-size: 1.5rem; letter-spacing: 0.4em; padding: 12px; border-radius: 14px; border: 1.5px solid var(--linha); background: var(--creme); color: var(--ink); margin: 18px 0 6px; }
  .portao input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .portao .erro { color: #c23b2a; min-height: 1.4em; margin: 0 0 10px; font-size: 0.9rem; }
  .portao .btn { width: 100%; justify-content: center; }
  #dica { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--creme); font-size: 0.82rem; padding: 7px 10px; border-radius: 8px; max-width: 260px; display: none; box-shadow: var(--sombra); }
  .menu-simples { display: flex; gap: 2px; margin-left: auto; }
  .menu-simples a { font-family: "Roboto Mono", monospace; font-size: 0.85rem; color: var(--ink-soft); text-decoration: none; padding: 8px 10px; }
  .menu-simples a:hover { color: var(--ink); }
  @media (max-width: 480px) { .wordmark span { display: none; } .menu-simples a { padding: 8px 7px; } .bloco { padding: 18px 16px; } }
</style>
</head>
<body>

<header class="topo">
  <div class="largo">
    <a class="wordmark" href="../../"><img src="../../logo-espaco-jovem.jpg" width="36" height="36" alt=""><span>Espaço Jovem</span></a>
    <nav class="menu-simples" aria-label="Navegação"><a href="../../">Site</a><a href="../../professores/">Professores</a><a href="#" id="sair" hidden>Sair</a></nav>
  </div>
</header>

<section class="faixa">
  <p class="olho">Área dos professores · enquete do Espaço Jovem</p>
  <h1>Resultados</h1>
  <p>O que as famílias e os jovens responderam até agora. Só números e sugestões, sem identificar ninguém.</p>
  <span class="atualizado" id="atualizado">carregando…</span>
</section>

<main id="app" aria-live="polite"></main>
<div id="dica" role="tooltip"></div>

<script>
  const API = "/moocamor-api/enquete/resumo";
  // Rótulos exatamente como as opções da enquete (../index.html).
  const ROTULOS = {
    quem: { responsavel: "Pais e responsáveis", jovem: "Jovens (12 a 17 anos)" },
    frequenta: { semanal: "Sim, toda semana", "as-vezes": "De vez em quando", "ainda-nao": "Ainda não, mas têm interesse" },
    quantos: { "1": "1", "2": "2", "3+": "3 ou mais" },
    interesseJovem: { sim: "Sim", talvez: "Talvez, depende das atividades", "nao-sei": "Não sei ainda", "nao-se-aplica": "Não se aplica" },
    faixas: { "3-5": "3 a 5 anos", "6-8": "6 a 8 anos", "9-11": "9 a 11 anos", "12-14": "12 a 14 anos", "15-17": "15 a 17 anos" },
    horarios: { "ter-tarde": "Terça à tarde (14h às 16h)", "ter-noite": "Terça à noite (18h30 às 20h)", "qua-noite": "Quarta à noite (18h30 às 20h)", "sab-manha": "Sábado de manhã (9h às 11h30)", "dom-pet": "1º domingo do mês (PET Fraterno)" },
    frequencia: { quinzenal: "Quinzenal", semanal: "Semanal", mensal: "Mensal" },
    temas: { "deus-gratidao": "Deus, criação e gratidão", "jesus-evangelho": "Jesus e o Evangelho", sentimentos: "Sentimentos e escolhas", "amizade-familia": "Amizade, família e convivência", caridade: "Caridade e solidariedade", progresso: "Imortalidade, reencarnação e progresso", interiorizacao: "Espiritualidade e interiorização" },
    atividades: { historias: "Histórias e rodas de conversa", musica: "Música", "teatro-arte": "Teatro e arte", jogos: "Jogos e brincadeiras", "acao-social": "Ação social", encontros: "Encontros e passeios", online: "Atividades on-line", festival: "Festival de Arte, Amor e Fraternidade" },
    encontroPais: { sim: "Sim", talvez: "Talvez", nao: "Não" },
    voluntario: { evangelizador: "Evangelizador(a)", "acolhida-lanche": "Acolhida ou lanche", "musica-artes": "Música ou artes", comunicacao: "Comunicação", "nao-agora": "Por enquanto não" },
    conversa: { sim: "Sim, prefere conversar pessoalmente", nao: "Não" },
    idadeJovem: { "12-14": "12 a 14 anos", "15-17": "15 a 17 anos" },
    viria: { sim: "Sim", talvez: "Talvez, depende das atividades", "nao-sei": "Não sei ainda" },
  };
  const ORDENADAS = new Set(["faixas", "idades", "quantos", "frequencia", "idadeJovem", "frequenta", "interesseJovem", "encontroPais", "conversa", "viria"]);

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (n, base) => (base ? Math.round((n / base) * 100) : 0);

  // Todas as opções da pergunta (zeros incluídos) + qualquer código novo que aparecer nos dados.
  function itens(campo, contagem, chaveRotulos = campo) {
    const rot = ROTULOS[chaveRotulos] || {};
    const lista = Object.keys(rot).map((k) => [k, rot[k], contagem[k] || 0]);
    for (const k of Object.keys(contagem)) if (!(k in rot)) lista.push([k, k, contagem[k]]);
    if (!ORDENADAS.has(campo)) lista.sort((a, b) => b[2] - a[2]);
    return lista;
  }

  function barras(titulo, campo, contagem, base, baseTexto, multipla, chaveRotulos) {
    const lista = itens(campo, contagem, chaveRotulos);
    const max = Math.max(1, ...lista.map((i) => i[2]));
    const lis = lista.map(([, rotulo, n]) => {
      const p = pct(n, base);
      const dica = `${rotulo}: ${n} ${n === 1 ? "resposta" : "respostas"} (${p}% de ${base})`;
      return `<li tabindex="0" data-dica="${esc(dica)}" aria-label="${esc(dica)}">
        <span class="rot">${esc(rotulo)}</span>
        <span class="pista"><span class="barra ${n ? "" : "zero"}" style="width:${(n / max) * 100}%"></span><span class="num"><b>${n}</b> · ${p}%</span></span>
      </li>`;
    }).join("");
    return `<div class="grafico"><h3>${esc(titulo)}</h3><p class="base">Base: ${base} ${esc(baseTexto)}${multipla ? " · pode marcar mais de uma, então a soma passa do total" : ""}</p><ul class="barras">${lis}</ul></div>`;
  }

  function calor(dados, dim) {
    const faixas = Object.keys(ROTULOS.faixas);
    const cruz = dados.cruzamentos[dim] || {};
    const opcoes = itens(dim, dados.contagens[dim] || {}).map((i) => [i[0], i[1]]);
    const max = Math.max(1, ...faixas.flatMap((f) => opcoes.map(([k]) => (cruz[f] || {})[k] || 0)));
    const cab = opcoes.map(([, r]) => `<th scope="col">${esc(r)}</th>`).join("");
    const linhas = faixas.map((f) => {
      const base = dados.porFaixa[f] || 0;
      const cels = opcoes.map(([k, r]) => {
        const n = (cruz[f] || {})[k] || 0;
        const t = n / max;
        const fundo = n ? `color-mix(in srgb, var(--barra) ${Math.round(12 + t * 88)}%, var(--branco))` : "var(--trilho)";
        const cor = t > 0.5 ? "var(--celula-texto-claro)" : "var(--celula-texto-escuro)";
        const dica = `${ROTULOS.faixas[f]} × ${r}: ${n} de ${base} ${base === 1 ? "resposta" : "respostas"} com essa faixa`;
        return `<td tabindex="0" style="background:${fundo};color:${n ? cor : "var(--ink-soft)"}" data-dica="${esc(dica)}" aria-label="${esc(dica)}">${n}</td>`;
      }).join("");
      return `<tr><th scope="row" class="faixa-col">${esc(ROTULOS.faixas[f])}<small>${base} ${base === 1 ? "resposta" : "respostas"}</small></th>${cels}</tr>`;
    }).join("");
    return `<div class="rolagem"><table class="calor"><thead><tr><th scope="col">Faixa</th>${cab}</tr></thead><tbody>${linhas}</tbody></table></div>
      <div class="escala"><span>menos</span><i aria-hidden="true"></i><span>mais</span></div>`;
  }

  function listaTextos(titulo, arr) {
    return `<div><h3 style="font-size:1rem;margin:0 0 8px">${esc(titulo)} <span class="vazio" style="font-style:normal">(${arr.length})</span></h3>
      ${arr.length ? `<ul>${arr.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : `<p class="vazio">Nenhuma ainda.</p>`}</div>`;
  }

  function desenhar(d) {
    const app = document.getElementById("app");
    const resp = (d.contagens.quem || {}).responsavel || 0;
    const jov = (d.contagens.quem || {}).jovem || 0;
    document.getElementById("atualizado").textContent = "atualizado " + new Date(d.atualizadoEm).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });

    if (!d.total) {
      app.innerHTML = `<div class="bloco aviso-vazio"><h2>Ainda não há respostas</h2><p class="sub">Assim que as famílias e os jovens responderem, os números aparecem aqui.</p><a class="btn laranja" href="../">Responder a enquete</a></div>`;
      return;
    }

    const c = d.contagens;
    app.innerHTML = `
      <div class="tiles">
        <div class="tile hero"><div class="rot">Respostas</div><div class="val">${d.total}</div></div>
        <div class="tile"><div class="rot">De pais e responsáveis</div><div class="val">${resp}</div></div>
        <div class="tile"><div class="rot">De jovens</div><div class="val">${jov}</div></div>
      </div>

      <section class="bloco">
        <h2>Por faixa de idade</h2>
        <p class="sub">Quantas respostas têm alguém em cada faixa: as idades marcadas pelas famílias somadas à idade informada pelos jovens. Uma família com filhos em duas faixas conta nas duas. A enquete não pergunta o número exato de crianças por faixa, então isto não é contagem de crianças.</p>
        ${barras("Respostas com alguém na faixa", "faixas", d.porFaixa, d.total, "respostas", true, "faixas")}
      </section>

      <section class="bloco">
        <h2>Faixa de idade × preferências</h2>
        <p class="sub">Para cada faixa, quantas respostas escolheram cada opção. Ajuda a ver, por exemplo, qual horário funciona melhor para quem tem filhos pequenos.</p>
        <div class="filtros" role="group" aria-label="Escolha o que cruzar com a faixa de idade">
          <button type="button" data-dim="horarios" aria-pressed="true">Dias e horários</button>
          <button type="button" data-dim="frequencia" aria-pressed="false">Frequência</button>
          <button type="button" data-dim="temas" aria-pressed="false">Temas</button>
          <button type="button" data-dim="atividades" aria-pressed="false">Atividades</button>
        </div>
        <div id="calor">${calor(d, "horarios")}</div>
      </section>

      <section class="bloco">
        <h2>Dias, horários e frequência</h2>
        <p class="sub">Respondido por famílias e jovens.</p>
        <div class="grade-graficos">
          ${barras("Dias e horários que funcionam", "horarios", c.horarios || {}, d.total, "respostas", true)}
          ${barras("Frequência preferida", "frequencia", c.frequencia || {}, d.total, "respostas", false)}
        </div>
      </section>

      <section class="bloco">
        <h2>O que vamos viver</h2>
        <p class="sub">Temas e atividades que mais atraem. Respondido por famílias e jovens.</p>
        <div class="grade-graficos">
          ${barras("Temas", "temas", c.temas || {}, d.total, "respostas", true)}
          ${barras("Atividades", "atividades", c.atividades || {}, d.total, "respostas", true)}
        </div>
      </section>

      <section class="bloco">
        <h2>As famílias</h2>
        <p class="sub">Só as respostas de pais e responsáveis (${resp}).</p>
        <div class="grade-graficos">
          ${barras("Já frequentam a Fraternidade do Amor?", "frequenta", c.frequenta || {}, resp, "respostas de responsáveis", false)}
          ${barras("Quantos participariam", "quantos", c.quantos || {}, resp, "respostas de responsáveis", false)}
          ${barras("Filhos com 12+ têm interesse?", "interesseJovem", c.interesseJovem || {}, resp, "respostas de responsáveis", false)}
          ${barras("Participariam do encontro com os pais", "encontroPais", c.encontroPais || {}, resp, "respostas de responsáveis", false)}
          ${barras("Querem ajudar como voluntário(a)", "voluntario", c.voluntario || {}, resp, "respostas de responsáveis", true)}
          ${barras("Querem conversar com a coordenação", "conversa", c.conversa || {}, resp, "respostas de responsáveis", false)}
        </div>
      </section>

      <section class="bloco">
        <h2>Os jovens</h2>
        <p class="sub">Só as respostas dos próprios jovens (${jov}).</p>
        <div class="grade-graficos">
          ${barras("Idade", "idadeJovem", c.idadeJovem || {}, jov, "respostas de jovens", false)}
          ${barras("Viriam ao Espaço Jovem?", "viria", c.viria || {}, jov, "respostas de jovens", false)}
        </div>
      </section>

      <section class="bloco">
        <h2>O que escreveram</h2>
        <p class="sub">Textos livres, como foram enviados, sem identificação.</p>
        <div class="textos">
          ${listaTextos("Sugestões", d.textos.sugestoes || [])}
          ${listaTextos("Assuntos que os jovens querem conversar", d.textos.assuntos || [])}
          ${listaTextos("Outros dias e horários sugeridos", d.textos.horarioOutro || [])}
        </div>
      </section>

      <ul class="notas">
        <li>Os percentuais usam como base só quem podia responder a pergunta: as perguntas da família contam só os responsáveis; as dos jovens, só os jovens.</li>
        <li>Perguntas deixadas em branco não entram na contagem daquela pergunta, por isso as barras de uma pergunta podem somar menos que a base.</li>
        <li>Nomes e contatos (voluntários e quem pediu conversa) ficam só com a coordenação.</li>
      </ul>`;

    app.querySelectorAll(".filtros button").forEach((b) => b.addEventListener("click", () => {
      app.querySelectorAll(".filtros button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      document.getElementById("calor").innerHTML = calor(d, b.dataset.dim);
    }));
  }

  // Dica ao passar o mouse ou focar (barras e células)
  const dica = document.getElementById("dica");
  function mostra(el, x, y) {
    dica.textContent = el.dataset.dica; dica.style.display = "block";
    const r = dica.getBoundingClientRect();
    dica.style.left = Math.min(x + 14, innerWidth - r.width - 8) + "px";
    dica.style.top = Math.max(8, y - r.height - 12) + "px";
  }
  document.addEventListener("mousemove", (e) => {
    const el = e.target.closest("[data-dica]");
    if (el) mostra(el, e.clientX, e.clientY); else dica.style.display = "none";
  });
  document.addEventListener("focusin", (e) => {
    const el = e.target.closest("[data-dica]");
    if (el) { const r = el.getBoundingClientRect(); mostra(el, r.left + r.width / 2, r.top); }
  });
  document.addEventListener("focusout", () => { dica.style.display = "none"; });

  // PIN dos professores (o mesmo da área dos professores). O servidor confere;
  // sem ele, a API não devolve nada. Fica só nesta sessão do navegador.
  const CHAVE_PIN = "espacojovem.pin";
  const lerPin = () => { try { return sessionStorage.getItem(CHAVE_PIN) || ""; } catch (e) { return ""; } };
  const gravarPin = (p) => { try { p ? sessionStorage.setItem(CHAVE_PIN, p) : sessionStorage.removeItem(CHAVE_PIN); } catch (e) {} };

  function portao(mensagem) {
    document.getElementById("atualizado").textContent = "acesso dos professores";
    document.getElementById("app").innerHTML = `<div class="portao"><form id="form-pin">
      <h2>Entrar</h2><p>Digite o PIN dos professores para ver os resultados.</p>
      <input type="password" inputmode="numeric" autocomplete="off" id="pin" maxlength="8" aria-label="PIN dos professores" required>
      <p class="erro" id="erro">${esc(mensagem || "")}</p>
      <button class="btn laranja" type="submit">Entrar</button></form></div>`;
    const input = document.getElementById("pin"); input.focus();
    document.getElementById("form-pin").addEventListener("submit", (ev) => { ev.preventDefault(); carregar(input.value.trim()); });
  }

  function carregar(pin) {
    if (!pin) return portao();
    fetch(API, { headers: { "X-Professores-Pin": pin } })
      .then((r) => {
        if (r.status === 403) { gravarPin(""); portao("PIN incorreto."); return null; }
        if (r.status === 429) { gravarPin(""); portao("Muitas tentativas. Tente de novo em 15 minutos."); return null; }
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then((d) => { if (!d) return; gravarPin(pin); document.getElementById("sair").hidden = false; desenhar(d); })
      .catch(() => {
        document.getElementById("atualizado").textContent = "indisponível agora";
        document.getElementById("app").innerHTML = `<div class="bloco aviso-vazio"><h2>Não foi possível carregar</h2><p class="sub">Tente de novo em instantes.</p></div>`;
      });
  }

  document.getElementById("sair").addEventListener("click", (ev) => {
    ev.preventDefault();
    gravarPin("");
    try { sessionStorage.removeItem("espacojovem.professores"); } catch (e) {}
    location.reload();
  });

  carregar(lerPin());
</script>
</body>
</html>
