<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Professores — Espaço Jovem</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#123c3f">
<link rel="icon" type="image/png" href="../icone-espaco-jovem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estilo.css">
<style>
  .faixa { background: linear-gradient(135deg, rgba(18, 60, 63, 0.94), rgba(118, 82, 168, 0.90)), url("../padrao-espaco-jovem.jpg") center / 480px auto repeat; color: #fff; text-align: center; padding: 56px 20px 60px; }
  .faixa .olho { color: #bfe0dd; }
  .faixa h1 { font-weight: 700; font-size: clamp(2rem, 6vw, 3rem); }
  .faixa p { margin: 10px auto 0; max-width: 60ch; opacity: 0.92; }

  .portao { min-height: 58vh; display: grid; place-items: center; padding: 56px 20px; }
  .portao form { width: 100%; max-width: 380px; text-align: center; background: var(--branco); border: 1.5px solid var(--linha); border-radius: 24px; padding: 30px 26px; box-shadow: var(--sombra); }
  .portao img { width: 92px; height: 92px; border-radius: 50%; }
  .portao h2 { font-size: 1.5rem; margin-top: 10px; }
  .portao p { color: var(--ink-soft); margin: 8px 0 0; }
  .portao input {
    width: 100%; text-align: center; font-family: "Roboto Mono", monospace; font-size: 1.5rem; letter-spacing: 0.4em;
    padding: 12px; border-radius: 14px; border: 1.5px solid var(--linha); background: var(--creme); color: var(--ink); margin: 18px 0 6px;
  }
  .portao input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .portao .erro { color: #c23b2a; min-height: 1.4em; margin: 0 0 10px; font-size: 0.9rem; }
  .portao .btn { width: 100%; justify-content: center; }

  .barra-acoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 0 0 26px; }
  .btn.claro { background: var(--branco); color: var(--ink); border: 1.5px solid var(--linha); }

  details.aula { background: var(--branco); border: 1.5px solid var(--linha); border-radius: 20px; }
  details.aula + details.aula { margin-top: 12px; }
  details.aula summary { list-style: none; cursor: pointer; padding: 16px 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 16px; align-items: center; }
  details.aula summary::-webkit-details-marker { display: none; }
  details.aula summary::after { content: "+"; font-size: 1.5rem; line-height: 1; color: var(--laranja); transition: transform 0.2s ease; grid-row: 1 / span 2; grid-column: 3; }
  details.aula[open] summary::after { transform: rotate(45deg); }
  .num { grid-row: 1 / span 2; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: "Poppins", sans-serif; font-weight: 700; background: var(--c); }
  details.aula summary h3 { margin: 0; font-size: 1.1rem; }
  .ativ { font-size: 0.88rem; color: var(--ink-soft); grid-column: 2; }
  .corpo { padding: 0 20px 20px; display: grid; gap: 14px; }
  .corpo .objetivo { margin: 0; }
  .lados { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
  .lado { border-radius: 16px; padding: 14px 16px; background: var(--fundo); }
  .lado h4 { font-weight: 600; font-size: 1rem; margin: 0 0 6px; color: var(--c); }
  .lado p { margin: 0; }
  .meta { margin: 0; font-size: 0.95rem; color: var(--ink-soft); }
  .meta b { color: var(--ink); }
  .vivencia { background: var(--ambar-soft); border-radius: 14px; padding: 10px 14px; }

  .dois { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
  .bloco-texto { background: var(--branco); border: 1.5px solid var(--linha); border-radius: 22px; padding: 22px 24px; }
  .bloco-texto h3 { margin: 0 0 12px; font-size: 1.15rem; }
  .checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .checklist label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .checklist input { margin-top: 6px; width: 18px; height: 18px; accent-color: var(--petroleo); flex-shrink: 0; }
  .menu-simples { display: flex; gap: 2px; margin-left: auto; }
  .menu-simples a { font-family: "Roboto Mono", monospace; font-size: 0.85rem; color: var(--ink-soft); text-decoration: none; padding: 8px 10px; }
  .menu-simples a:hover { color: var(--ink); }
  @media (max-width: 480px) { .wordmark span { display: none; } .menu-simples a { padding: 8px 7px; } }
  @media print { .barra-acoes, .topo { display: none !important; } details.aula { break-inside: avoid; } }
</style>
</head>
<body>

<header class="topo">
  <div class="largo">
    <a class="wordmark" href="../"><img src="../logo-espaco-jovem.jpg" width="36" height="36" alt=""><span>Espaço Jovem</span></a>
    <nav class="menu-simples" aria-label="Navegação">
      <a href="../">Site</a>
      <a href="../ideias/">Ideias</a>
      <a href="#" id="sair" hidden>Sair</a>
    </nav>
  </div>
</header>

<section class="faixa">
  <p class="olho">Área dos professores</p>
  <h1>Planejamento e aulas</h1>
  <p>Roteiros do ano, vivências, materiais e o guia de acolhimento à neurodiversidade.</p>
</section>

<main id="app">
  <div class="portao">
    <form id="form-pin">
      <img src="../logo-espaco-jovem.jpg" width="92" height="92" alt="">
      <h2>Entrar</h2>
      <p>Digite o PIN dos professores.</p>
      <input type="password" inputmode="numeric" autocomplete="off" id="pin" maxlength="8" aria-label="PIN dos professores" required>
      <p class="erro" id="erro"></p>
      <button class="btn laranja" type="submit">Entrar</button>
    </form>
  </div>
</main>

<script src="aulas.js"></script>
<script>
  // Porta simples, por decisão do grupo: o PIN só esconde a tela. O conteúdo
  // está no código público (aulas.js), então não é segredo. Guardamos aqui só
  // o SHA-256 de "espacojovem:<PIN>", nunca o PIN.
  const PIN_HASH = "210c8b8d02f9f50584ea271549993fe7e2d6563339e8e63be230ef4279652dfe";
  const CHAVE = "espacojovem.professores";
  const CORES = ["var(--petroleo)", "var(--laranja)", "var(--roxo)", "var(--ambar)"];

  async function sha256(texto) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function liberado() {
    try { return sessionStorage.getItem(CHAVE) === PIN_HASH; } catch (e) { return false; }
  }

  function mostrarAulas() {
    const dados = window.ESPACO_JOVEM_AULAS;
    const fontes = window.ESPACO_JOVEM_FONTES;
    const inc = window.ESPACO_JOVEM_INCLUSAO;
    const aulas = dados.aulas.map((a, i) => {
      const links = (a.fontes || []).map((k) => fontes[k]).filter(Boolean)
        .map((f) => `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.nome)}</a>`).join(" · ");
      return `
        <details class="aula" style="--c:${CORES[i % 4]}" ${i === 0 ? "open" : ""}>
          <summary><span class="num">${i + 1}</span><h3>${esc(a.titulo)}</h3><span class="ativ">${esc(a.mes)} · ${esc(a.atividade)}</span></summary>
          <div class="corpo">
            <p class="objetivo"><b>Objetivo:</b> ${esc(a.objetivo)}</p>
            <div class="lados">
              <div class="lado" style="--c:var(--laranja-txt);--fundo:var(--laranja-soft)"><h4>Crianças (3 a 8 anos)</h4><p>${esc(a.criancas)}</p></div>
              <div class="lado" style="--c:var(--petroleo);--fundo:var(--verde-soft)"><h4>Maiores (9 a 17 anos)</h4><p>${esc(a.maiores)}</p></div>
            </div>
            ${a.referencias && a.referencias.length ? `<p class="meta"><b>Referências:</b> ${a.referencias.map(esc).join("; ")}</p>` : ""}
            ${links ? `<p class="meta"><b>Materiais:</b> ${links}</p>` : ""}
            <p class="meta vivencia"><b>Vivência da semana (convite, sem cobrança):</b> ${esc(a.vivencia)}</p>
          </div>
        </details>`;
    }).join("");

    const todasFontes = Object.values(fontes)
      .map((f) => `<li><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.nome)}</a></li>`).join("");
    const pares = (lista) => lista.map(([t, d]) => `<li><b>${esc(t)}:</b> ${esc(d)}</li>`).join("");

    document.getElementById("app").innerHTML = `
      <section class="secao" style="padding-top:56px">
        <div class="coluna" style="max-width:900px">
          <div class="cab">
            <p class="olho">${esc(dados.status)}</p>
            <h2>${esc(dados.titulo)}: <span class="marca-texto">12 temas</span></h2>
            <p class="intro">${esc(dados.nota)} Grupos: 3 a 5, 6 a 8, 9 a 11 e 12 a 17 anos.</p>
          </div>
          <div class="barra-acoes">
            <button class="btn claro" type="button" onclick="document.querySelectorAll('details.aula').forEach(d => d.open = true)">Abrir todas</button>
            <button class="btn claro" type="button" onclick="window.print()">Imprimir ou salvar PDF</button>
            <a class="btn petroleo" href="#inclusao">Guia de inclusão</a>
          </div>
          ${aulas}
        </div>
      </section>
      <section class="secao branca">
        <div class="largo dois">
          <div class="bloco-texto">
            <h3>Metodologia de cada encontro (cerca de 60 min)</h3>
            <ul class="lista-bolinha">
              <li><b>5 min · Acolhimento:</b> recepção, música ou dinâmica breve.</li>
              <li><b>10 min · Integração:</b> brincadeira ou partilha voluntária (a boa notícia).</li>
              <li><b>10 min · História ou conteúdo.</b></li>
              <li><b>20 min · Atividade:</b> jogo, dramatização, arte ou roda de conversa.</li>
              <li><b>10 min · Vivência:</b> escolher uma atitude possível para a semana.</li>
              <li><b>5 min · Encerramento:</b> síntese e prece facultativa.</li>
            </ul>
          </div>
          <div class="bloco-texto">
            <h3>Fontes de apoio</h3>
            <ul class="lista-bolinha">${todasFontes}<li>O Evangelho segundo o Espiritismo e O Livro dos Espíritos</li><li>Livros da Federação Espírita por faixa etária (com a Alexandra)</li></ul>
            <p class="nota">Sempre dois adultos por sala. Com crianças, acolher sem estimular a mediunidade. Nada de medo, culpa ou exposição.</p>
          </div>
        </div>
      </section>
      <section class="secao" id="inclusao">
        <div class="largo">
          <div class="cab">
            <p class="olho">Anexo do projeto</p>
            <h2>Atividades práticas e <span class="marca-texto">neurodiversidade</span></h2>
            <p class="intro">Propostas adaptáveis por faixa etária. Considere os interesses, a comunicação, o ritmo, as necessidades sensoriais e a segurança de cada participante.</p>
          </div>
          <div class="dois">
            <div class="bloco-texto"><h3>Atividades práticas para os encontros</h3><ul class="lista-bolinha">${pares(inc.atividades)}</ul></div>
            <div class="bloco-texto"><h3>Acolhimento à neurodiversidade</h3><ul class="lista-bolinha">${pares(inc.principios)}</ul></div>
            <div class="bloco-texto"><h3>Exemplo de encontro inclusivo (60 min)</h3><ul class="lista-bolinha">${inc.encontro.map(([t, n, d]) => `<li><b>${esc(t)} · ${esc(n)}:</b> ${esc(d)}</li>`).join("")}</ul></div>
            <div class="bloco-texto"><h3>Checklist antes de cada aula</h3><ul class="checklist">${inc.checklist.map((c) => `<li><label><input type="checkbox"> <span>${esc(c)}</span></label></li>`).join("")}</ul>
              <h3 style="margin-top:22px">Uso dos materiais</h3><ul class="lista-bolinha">${inc.usoMateriais.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>
          </div>
        </div>
      </section>`;
    document.getElementById("sair").hidden = false;
    window.scrollTo(0, 0);
  }

  document.getElementById("form-pin").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const erro = document.getElementById("erro");
    const pin = document.getElementById("pin").value.trim();
    if ((await sha256("espacojovem:" + pin)) !== PIN_HASH) {
      erro.textContent = "PIN incorreto.";
      return;
    }
    try { sessionStorage.setItem(CHAVE, PIN_HASH); } catch (e) {}
    mostrarAulas();
  });

  document.getElementById("sair").addEventListener("click", (ev) => {
    ev.preventDefault();
    try { sessionStorage.removeItem(CHAVE); } catch (e) {}
    location.reload();
  });

  if (liberado()) mostrarAulas();
</script>
</body>
</html>
